[project]
name = "xtium-sharepoint-mcp"
version = "0.1.0"
description = "Local, user-delegated SharePoint MCP connector (AIDATA-3958 pilot)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "msal>=1.31",
    "msal-extensions>=1.2",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.scripts]
xtium-sharepoint-mcp = "xtium_sharepoint_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xtium_sharepoint_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
